name: Bomber QA Automation

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: Test only, or update/build and run full regression
        required: true
        default: TestOnly
        type: choice
        options:
          - TestOnly
          - BuildAndRegression
          - FailurePipelineDemo
      suite:
        description: Suite for TestOnly mode (other modes choose their required suite)
        required: true
        default: All
        type: choice
        options:
          - All
          - Unit
          - Integration
          - System
          - Acceptance
      sheet_sync:
        description: Update Google Sheet
        required: true
        default: true
        type: boolean
      jira_sync:
        description: Create or update Jira for failures
        required: true
        default: true
        type: boolean
      slack_notification:
        description: Send Slack result notification
        required: true
        default: true
        type: boolean
  schedule:
    # GitHub cron uses UTC. 00:00 UTC is 09:00 KST.
    - cron: '0 0 * * *'

permissions:
  contents: read

concurrency:
  group: bomber-qa-local
  cancel-in-progress: false

jobs:
  qa:
    name: Run Bomber QA
    runs-on: [self-hosted, Windows, X64, bomber-qa]
    timeout-minutes: 120
    env:
      PROJECT_ROOT: D:\Projects\Bomber
      ARTIFACT_ROOT: D:\Projects\Bomber\Saved\Automation\GitHub\${{ github.run_id }}-${{ github.run_attempt }}
      EXECUTION_MODE: ${{ github.event_name == 'schedule' && 'TestOnly' || inputs.execution_mode }}
      REQUESTED_SUITE: ${{ github.event_name == 'schedule' && 'All' || inputs.suite }}
      SHEET_SYNC: ${{ github.event_name == 'schedule' && 'true' || inputs.sheet_sync }}
      JIRA_SYNC: ${{ github.event_name == 'schedule' && 'true' || inputs.jira_sync }}
      SLACK_NOTIFICATION: ${{ github.event_name == 'schedule' && 'true' || inputs.slack_notification }}

    steps:
      - name: Validate local project
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path -LiteralPath $env:PROJECT_ROOT)) {
            throw "Project root was not found: $env:PROJECT_ROOT"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:PROJECT_ROOT 'Bomber.uproject'))) {
            throw 'Bomber.uproject was not found.'
          }
          if (Get-Process -Name 'UnrealEditor','UnrealEditor-Cmd' -ErrorAction SilentlyContinue) {
            throw 'Close Unreal Editor before running unattended QA.'
          }
          $dirty = & git -C $env:PROJECT_ROOT status --porcelain
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the local Git worktree.' }
          if ($dirty) { throw 'The local Git worktree has uncommitted changes.' }
          $localBranch = (& git -C $env:PROJECT_ROOT branch --show-current).Trim()
          $localRevision = (& git -C $env:PROJECT_ROOT rev-parse HEAD).Trim()
          if ($env:EXECUTION_MODE -eq 'BuildAndRegression') {
            if ($env:GITHUB_REF_NAME -ne 'master') {
              throw 'BuildAndRegression must be dispatched from the master branch.'
            }
            if ($localBranch -ne 'master') {
              throw "BuildAndRegression requires the local master branch. Current branch: $localBranch"
            }
            & git -C $env:PROJECT_ROOT fetch origin master
            if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch origin/master.' }
            $remoteRevision = (& git -C $env:PROJECT_ROOT rev-parse origin/master).Trim()
            if ($remoteRevision -ne $env:GITHUB_SHA) {
              throw "origin/master $remoteRevision does not match workflow revision $env:GITHUB_SHA."
            }
            if ($localRevision -ne $remoteRevision) {
              & git -C $env:PROJECT_ROOT merge --ff-only origin/master
              if ($LASTEXITCODE -ne 0) { throw 'Local master could not be fast-forwarded safely.' }
              $localRevision = (& git -C $env:PROJECT_ROOT rev-parse HEAD).Trim()
            }
          } elseif ($localRevision -ne $env:GITHUB_SHA) {
            throw "Local revision $localRevision does not match workflow revision $env:GITHUB_SHA. Use BuildAndRegression or update the local checkout first."
          }
          if ($env:SHEET_SYNC -eq 'true' -and -not (Test-Path -LiteralPath (Join-Path $env:PROJECT_ROOT 'Tools\QA\qa-sheet.local.json'))) {
            throw 'Google Sheet local configuration is missing.'
          }
          if (($env:JIRA_SYNC -eq 'true' -or $env:SLACK_NOTIFICATION -eq 'true') -and
              -not (Test-Path -LiteralPath (Join-Path $env:PROJECT_ROOT 'Tools\QA\qa-integrations.local.json'))) {
            throw 'Jira/Slack local configuration is missing.'
          }

      - name: Build BomberEditor for regression
        if: env.EXECUTION_MODE == 'BuildAndRegression'
        shell: powershell
        run: |
          $buildScript = Join-Path $env:PROJECT_ROOT 'Tools\QA\Build-BomberEditor.ps1'
          $buildArtifactRoot = Join-Path $env:ARTIFACT_ROOT 'Build'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $buildScript -OutputDirectory $buildArtifactRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run requested QA suite
        id: qa
        shell: powershell
        run: |
          $runner = Join-Path $env:PROJECT_ROOT 'Tools\QA\Invoke-BomberQaAutomation.ps1'
          $suite = if ($env:EXECUTION_MODE -eq 'BuildAndRegression') {
            'All'
          } elseif ($env:EXECUTION_MODE -eq 'FailurePipelineDemo') {
            'System'
          } else {
            $env:REQUESTED_SUITE
          }
          $arguments = @(
            '-NoLogo', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', $runner,
            '-Suite', $suite
          )
          if ($env:SHEET_SYNC -ne 'true') { $arguments += '-SkipSheetSync' }
          if ($env:JIRA_SYNC -ne 'true') { $arguments += '-SkipJiraSync' }
          if ($env:SLACK_NOTIFICATION -ne 'true') { $arguments += '-SkipSlackNotification' }
          if ($env:EXECUTION_MODE -eq 'FailurePipelineDemo') { $arguments += '-JiraFailureDemo' }
          $env:BOMBER_QA_ARTIFACT_ROOT = $env:ARTIFACT_ROOT
          $exitCode = 99
          try {
            & powershell.exe @arguments
            $exitCode = $LASTEXITCODE
          } catch {
            Write-Error $_
          }
          "exit_code=$exitCode" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          exit 0

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bomber-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: 14

      - name: Apply QA result
        if: always()
        shell: powershell
        run: |
          $exitCode = '${{ steps.qa.outputs.exit_code }}'
          if (-not $exitCode) { throw 'QA runner did not return an exit code.' }
          if ([int]$exitCode -ne 0) { exit [int]$exitCode }
